<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>three.js glass and light</title>
<style>
  html, body { margin: 0; background: #0b0b10; overflow: hidden; }
  canvas { display: block; }
  #shade { position: absolute; left: 0; bottom: 0; width: 620px; height: 200px; background: radial-gradient(ellipse at 0% 100%, rgba(11,11,16,0.85) 0%, rgba(11,11,16,0) 70%); }
  #label { position: absolute; left: 44px; bottom: 36px; color: #f4efe6; font-family: Bahnschrift, 'Segoe UI', sans-serif; }
  #label b { display: block; font-size: 30px; letter-spacing: -0.5px; }
  #label span { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 13px; letter-spacing: 2px; opacity: 0.55; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="shade"></div><div id="label"><b>three.js</b><span>PHYSICAL GLASS / INSTANCED MESH / BLOOM</span></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1280, H = 720, FPS = 30;
const PAL = { bg: 0x0b0b10, coral: 0xff5a36, amber: 0xffb020, cyan: 0x2bc4e6, violet: 0x7a5cff, cream: 0xf4efe6 };

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.bg);
scene.fog = new THREE.FogExp2(PAL.bg, 0.095);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);

// Lights: a cool key and two coloured rims.
const key = new THREE.DirectionalLight(PAL.cream, 1.4); key.position.set(4, 8, 3); scene.add(key);
const rimA = new THREE.PointLight(PAL.coral, 40, 20); rimA.position.set(-4, 3, -3); scene.add(rimA);
const rimB = new THREE.PointLight(PAL.cyan, 30, 20); rimB.position.set(4, 2.5, -4); scene.add(rimB);

// Instanced field of rounded columns; per-instance colour doubles as emission on wave crests.
const N = 38, GAP = 0.52;
const colGeo = new RoundedBoxGeometry(0.44, 1, 0.44, 2, 0.05);
const colMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.75, roughness: 0.28 });
colMat.onBeforeCompile = (sh) => {
  sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>',
    '#include <emissivemap_fragment>\n#ifdef USE_INSTANCING_COLOR\n totalEmissiveRadiance += vColor * 1.8;\n#endif');
};
const field = new THREE.InstancedMesh(colGeo, colMat, N * N);
field.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(field);
const dummy = new THREE.Object3D();
const tmp = new THREE.Color(), tmp2 = new THREE.Color();
const cA = new THREE.Color(PAL.coral), cB = new THREE.Color(PAL.amber), cC = new THREE.Color(PAL.violet), cD = new THREE.Color(PAL.cyan);
const base = new THREE.Color(0.03, 0.03, 0.045);

function updateField(t) {
  let i = 0;
  for (let gx = 0; gx < N; gx++) for (let gz = 0; gz < N; gz++) {
    const x = (gx - (N - 1) / 2) * GAP, z = (gz - (N - 1) / 2) * GAP;
    const d = Math.hypot(x, z), ang = Math.atan2(z, x);
    const wave = 0.5 + 0.5 * Math.sin(d * 1.55 - t * 3.0 + Math.sin(ang * 3 + t) * 0.35);
    const fall = Math.exp(-d * 0.11);
    const h = 0.18 + 1.25 * Math.pow(wave, 2.2) * fall + (d < 1.3 ? -0.15 : 0);
    dummy.position.set(x, h / 2 - 0.6, z);
    dummy.scale.set(1, Math.max(h, 0.05), 1);
    dummy.updateMatrix();
    field.setMatrixAt(i, dummy.matrix);
    // Crest glow: warm on one side, cool on the other, rotating slowly.
    const crest = Math.pow(wave, 22) * fall;
    const side = 0.5 + 0.5 * Math.sin(ang + t * 0.6);
    tmp.copy(cA).lerp(cB, side * 0.8);
    if (d > 6.0) tmp.lerp(cC, Math.min(1, (d - 6.0) * 0.5));
    tmp.multiplyScalar(crest * 1.3);
    const ring = Math.max(0, 1 - Math.abs(d - 3.4 - Math.sin(t * 0.9) * 0.5) / 0.22);
    tmp.add(tmp2.copy(cD).multiplyScalar(ring * ring * 0.5));
    tmp.add(base);
    field.setColorAt(i, tmp);
    i++;
  }
  field.instanceMatrix.needsUpdate = true;
  field.instanceColor.needsUpdate = true;
}

// Hero: a glass torus knot with a glowing core.
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0, roughness: 0.04, transmission: 1, thickness: 1.4, ior: 1.45,
  clearcoat: 1, clearcoatRoughness: 0.02, iridescence: 0.7, iridescenceIOR: 1.3,
  iridescenceThicknessRange: [200, 600], attenuationColor: new THREE.Color(0xd9ccff), attenuationDistance: 3.5,
  specularIntensity: 1, envMapIntensity: 1.4,
});
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.85, 0.28, 360, 56, 2, 3), glass);
scene.add(knot);
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.32, 4),
  new THREE.MeshStandardMaterial({ color: 0x000000, emissive: PAL.amber, emissiveIntensity: 3 }));
scene.add(core);

// Orbiting chrome and satin spheres.
const orbiters = [
  { mat: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 1, roughness: 0.08 }), r: 2.2, s: 0.22, sp: 0.9, ph: 0, y: 0.5 },
  { mat: new THREE.MeshPhysicalMaterial({ color: PAL.violet, metalness: 0.2, roughness: 0.25, clearcoat: 1 }), r: 2.6, s: 0.17, sp: -0.7, ph: 2.1, y: -0.3 },
  { mat: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: PAL.cyan, emissiveIntensity: 4 }), r: 1.9, s: 0.08, sp: 1.4, ph: 4.0, y: 0.9 },
  { mat: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: PAL.coral, emissiveIntensity: 4 }), r: 2.9, s: 0.07, sp: -1.1, ph: 1.0, y: 0.2 },
].map(o => { o.mesh = new THREE.Mesh(new THREE.SphereGeometry(o.s, 48, 32), o.mat); scene.add(o.mesh); return o; });

// Post-processing: MSAA half-float target, bloom, then tone mapping and sRGB in OutputPass.
const rt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.85, 0.55, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const ease = (x) => x * x * (3 - 2 * x);
function renderFrame(f) {
  const t = f / FPS;
  const u = ease(Math.min(1, t / 7));
  const ang = 0.35 + u * 1.25;
  const rad = 8.0 - u * 0.9;
  camera.position.set(Math.sin(ang) * rad, 2.3 + u * 1.3, Math.cos(ang) * rad);
  camera.lookAt(0, 1.25 + u * 0.15, 0);

  const hover = 1.75 + Math.sin(t * 1.3) * 0.12;
  knot.position.set(0, hover, 0);
  knot.rotation.set(t * 0.35, t * 0.55, t * 0.12);
  core.position.copy(knot.position);
  core.scale.setScalar(1 + Math.sin(t * 4) * 0.08);
  for (const o of orbiters) {
    const a = o.ph + t * o.sp;
    o.mesh.position.set(Math.cos(a) * o.r, hover + o.y + Math.sin(a * 2) * 0.2, Math.sin(a) * o.r);
  }
  updateField(t);
  composer.render();
}
window.renderFrame = renderFrame;
window.ready = Promise.resolve(true);
</script>
</body>
</html>
