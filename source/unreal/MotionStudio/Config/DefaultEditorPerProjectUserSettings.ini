; Start the Unreal MCP server with the editor: http://127.0.0.1:8000/mcp
; With tool search on, tools/list returns list_toolsets, describe_toolset and call_tool.
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=True
ServerPortNumber=8000
ServerUrlPath=/mcp
bEnableToolSearch=True

; Keep full speed when the editor window is in the background (the MCP drives it headless)
[/Script/UnrealEd.EditorPerformanceSettings]
bThrottleCPUWhenNotForeground=False
bMonitorEditorPerformance=False
