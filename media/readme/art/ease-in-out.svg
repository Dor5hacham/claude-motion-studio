<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" width="120" height="96" role="img" aria-labelledby="t d">
<title id="t">Ease-in-out curve</title>
<desc id="d">The ease-in-out easing curve with dots at equal time steps; a coral dot runs the curve.</desc>
<style>
text{font-family:'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace}.d{font-family:Bahnschrift, 'Segoe UI', Helvetica, Arial, sans-serif}
.gx{animation:gx 2s linear infinite both}
@keyframes gx{0%{transform:translate(0px,0);animation-timing-function:linear}70%,100%{transform:translate(68px,0)}}
.gy{animation:gy 2s linear infinite both}
@keyframes gy{0%{transform:translate(0,0px);animation-timing-function:cubic-bezier(0.42,0,0.58,1)}70%,100%{transform:translate(0,-48px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="119" height="95" rx="8" fill="#0b0b10" stroke="#2a2a38"/>
<rect x="6" y="6" width="108" height="84" rx="5" fill="#14141c"/>
<path d="M26,80.5h68M26,32.5h68M26.5,80V32" stroke="#2a2a38" stroke-dasharray="2 3"/>
<path d="M26,80C54.6,80 65.4,32 94,32" fill="none" stroke="#ffb020" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="26" cy="80" r="2.4" fill="#14141c" stroke="#ece7de" stroke-width="1.1"/><circle cx="37.3" cy="77.3" r="2.4" fill="#14141c" stroke="#ece7de" stroke-width="1.1"/><circle cx="48.7" cy="68.9" r="2.4" fill="#14141c" stroke="#ece7de" stroke-width="1.1"/><circle cx="60" cy="56" r="2.4" fill="#14141c" stroke="#ece7de" stroke-width="1.1"/><circle cx="71.3" cy="43.1" r="2.4" fill="#14141c" stroke="#ece7de" stroke-width="1.1"/><circle cx="82.7" cy="34.7" r="2.4" fill="#14141c" stroke="#ece7de" stroke-width="1.1"/><circle cx="94" cy="32" r="2.4" fill="#14141c" stroke="#ece7de" stroke-width="1.1"/>
<g transform="translate(26,80)"><g class="gx" transform="translate(68,0)"><g class="gy" transform="translate(0,-48)"><circle r="7" fill="#ff5a36" fill-opacity=".28"/><circle r="4" fill="#ff5a36"/></g></g></g>
</svg>
